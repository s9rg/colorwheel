name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check:release

  build:
    name: Build Pages artifact
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v6
      - run: npm run build:demo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo/dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify deployed site
        env:
          COLORWHEEL_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 "$COLORWHEEL_PAGE_URL" --output /tmp/colorwheel-index.html
          grep --fixed-strings "<title>Colorwheel" /tmp/colorwheel-index.html
