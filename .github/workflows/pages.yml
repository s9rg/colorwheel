name: GitHub Pages

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v6
      - run: npm run build:demo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo/dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify deployed site
        env:
          COLORWHEEL_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 "$COLORWHEEL_PAGE_URL" --output /tmp/colorwheel-index.html
          grep --fixed-strings "<title>Colorwheel" /tmp/colorwheel-index.html
