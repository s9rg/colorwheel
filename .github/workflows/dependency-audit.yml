name: Dependency audit

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.directory }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: [".", "examples/consumer-lab"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm audit --package-lock-only --audit-level=low
        working-directory: ${{ matrix.directory }}
